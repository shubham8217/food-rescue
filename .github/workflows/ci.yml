name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install and build
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          cp .env.example .env
          docker compose --profile all config -q
          POSTGRES_USER=u POSTGRES_DB=d POSTGRES_PASSWORD=p RABBITMQ_USER=u RABBITMQ_PASSWORD=p \
          JWT_SECRET=0123456789abcdef0123456789abcdef INGEST_API_KEY=k ADMIN_EMAIL=a@b.c ADMIN_PASSWORD=0123456789abc \
          docker compose -f docker-compose.prod.yml config -q
